# AI Roleplay settings template. Copy this to config.ini and edit that (config.ini is git-ignored;
# it is created from this file automatically on first run). Missing keys fall back to the defaults
# in hoi4_rp/config.py. The API key is never stored here: it is read from the environment variable
# named by api_key_env.

[llm]
# OpenAI-compatible endpoint (NanoGPT).
base_url = https://nano-gpt.com/api/v1
api_key_env = NANOGPT_API_KEY
model = xiaomi/mimo-v2.6-pro
# Higher = more varied writing. 0.0 - 2.0
temperature = 0.9
max_tokens = 1500
# Seconds to wait for a reply, and how many times to retry server errors / timeouts.
timeout = 120
retries = 2
# Background calls of one kind running at once (policy refreshes, AI-to-AI exchanges, agendas). NanoGPT takes up to
# 50 at a time; more finishes the background work sooner, the number of calls stays the same.
parallel = 8
# Every LLM call is logged (tokens, time) to data/logs/llm.jsonl; `python -m hoi4_rp usage` sums it up.
# yes also keeps each full prompt and reply in data/logs/prompts/ (large; for debugging).
log_prompts = no

[letters]
# Countries write to you on their own: about events involving you, or when it has been quiet.
incoming = yes
# Game days without any incoming letter before a country writes unprompted.
quiet_days = 60
# Game days before the same country starts another letter on its own.
cooldown_days = 30
# Game days a declined proposal item (e.g. military access) is off the table for that country,
# unless something big happens between you (war, territory, factions, governments).
refusal_days = 180
# Game days between formal proposals (Accept/Decline) from anyone.
proposal_gap_days = 30

# Game days between letters countries start on their own without an event (urgent policies, quiet
# spells). Letters about events involving you (a war, a border change) still come right away.
letter_gap_days = 20

# How letters are written: serious (formal diplomacy), dramatic (over-the-top national caricatures)
# or players (casual, like people playing those countries in a multiplayer roleplay game).
style = serious

# How readily countries make deals (land, factories, subjects, submission): realistic (history's logic:
# sovereignty yielded only under pressure, principled refusals common), balanced (a game played for good
# stories: good offers taken, fair ones negotiated, poor ones refused courteously) or open (pragmatic
# dealmakers: almost anything has a price).
diplomacy = balanced

# Make peace for your whole faction by letter, even as a mere member: agree it with the enemy faction's
# leader (or a country fighting alone) and both factions come to the conference, with you making your side's
# demands and holding its war score. no: only faction leaders and countries alone make peace (as the game).
member_peace = no

[story]
# Story events: your own country reacts to the deals you make by letter and to your deeds (wars, guarantees,
# peaces), with 2-3 choices carrying small effects (political power, stability, war support, party popularity,
# the other country's opinion). Only about what this mod adds, so other mods' events are left alone.
events = yes
# Game days at least between two story events.
gap_days = 60
# News events: a newspaper popup (headline, short report, one button, no effect) about what the storyteller's
# incidents between other countries came to; needs [ai_diplomacy] mode = on and driver = storyteller.
news = yes
# Game days at least between two news events.
news_gap_days = 10

[ai_diplomacy]
# Countries other than you write to each other (diplomacy.py), logged to data/logs/ai_diplomacy.txt. off; dry (written
# and logged, nothing reaches the game); or on (every kind of deal they agree takes effect, as in a letter to you, and is
# news in the chronicle). A few short LLM calls a game month, beside your own letters.
# python -m hoi4_rp ai-undo ends the pacts, market access, guarantees and commitments they put in place.
mode = off
# Who picks the pairs that write to each other: random (a monthly draw weighted by what ties them) or storyteller
# (storyteller.py: countries have agendas, and once a month one incident that serves an aim of the country that
# acts is picked: a guarantee, a commitment or an ultimatum, paced by what happens near you; guarantees need the
# tension rules to allow them, ultimatums 10% world tension). python -m hoi4_rp agendas / storyteller try it dry.
driver = random
# AI-to-AI exchanges started per game month (each is two short LLM calls).
exchanges_per_month = 3
# Game days before the same two countries talk again.
cooldown_days = 90
# Who gives guarantees between AI countries: game (HOI4's AI, as well as our deals) or ours (AI countries can't use
# the game's Guarantee action; the storyteller gives one a month where a threat calls for it, as a deal, so set
# mode = on and driver = storyteller). Focuses, events and your own Guarantee button are unchanged. Needs
# python -m hoi4_rp write-mod once.
guarantees = game
# Who moves the factions between AI countries: game (HOI4's AI invites, joins, expels and leaves, as well as our deals)
# or ours (AI countries can't; the storyteller may join, found or break one a month, so set mode = on and
# driver = storyteller). Focuses, decisions, events and your own faction buttons are unchanged. Needs
# python -m hoi4_rp write-mod once.
factions = game
# Who starts wars between countries: game (HOI4's AI declares and justifies on its own) or ours (the storyteller
# decides each month which would-be wars happen: war, an ultimatum first, preparing a war goal, or waiting). Wars from
# focuses and events, guarantors and allies joining, and your own wars are unchanged. Needs mode = on,
# driver = storyteller, the hoi4-bridge with bridge.wars, and python -m hoi4_rp write-mod once.
wars = game

[world]
# Which history the AI reasons from: a lore file in lore/ (vanilla, kaiserreich, halflife, or your own), or auto
# (picks the file whose ideologies are in play; see lore/README.md).
setting = auto
# Optional text file with extra setting notes added to every prompt (path relative to this folder, or absolute).
lore_file =
# Letter deals keep to the game's world tension rules: a guarantee only once the guarantor may give one, a faction
# (joining or admitting) only once both sides may join one; the thresholds are each country's own (its ideology
# and spirits). yes, or no for deals free of them (France guaranteeing you at 0% tension).
tension_rules = yes
# Countries know your country only as well as their intelligence on you allows (HOI4's civilian, army, navy and air
# intel): your factories and forces are estimates, the less intel the rougher; your national focuses unknown with
# little civilian intel. Used in their letters, replies, policies and ultimatum decisions. yes, or no for full knowledge.
intel = no
# Countries notice your troops massing on their border: more than this many of your divisions on the tiles along
# one country's border for a week. 0 turns it off.
border_divisions = 5
# HOI4 install folder, read for subject levels (game and mod files). Empty = found automatically
# (the running game, else the Steam libraries).
game_dir =
