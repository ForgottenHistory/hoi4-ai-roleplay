# AI Roleplay settings template. Copy this to config.ini and edit that (config.ini is git-ignored;
# it is created from this file automatically on first run). Missing keys fall back to the defaults
# in hoi4_rp/config.py. The API key is never stored here: it is read from the environment variable
# named by api_key_env.

[llm]
# OpenAI-compatible endpoint (NanoGPT).
base_url = https://nano-gpt.com/api/v1
api_key_env = NANOGPT_API_KEY
model = xiaomi/mimo-v2.6-pro
# Higher = more varied writing. 0.0 - 2.0
temperature = 0.9
max_tokens = 1500
# Seconds to wait for a reply, and how many times to retry server errors / timeouts.
timeout = 120
retries = 2

[letters]
# Countries write to you on their own: about events involving you, or when it has been quiet.
incoming = yes
# Game days without any incoming letter before a country writes unprompted.
quiet_days = 60
# Game days before the same country starts another letter on its own.
cooldown_days = 30
# Game days a declined proposal item (e.g. military access) is off the table for that country,
# unless something big happens between you (war, territory, factions, governments).
refusal_days = 180
# Game days between formal proposals (Accept/Decline) from anyone.
proposal_gap_days = 30
